name: Build NovaCraft Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS Universal (.dmg per Apple Silicon ARM e Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust & Apple Targets (ARM64 + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, universal-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Universal App for macOS (ARM + Intel)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS Artifacts (.dmg e .app)
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-macOS-Universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
